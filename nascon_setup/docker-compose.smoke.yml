# Smoke test for the pre-pulled NaSCon bundle — proves the images start and
# the QA tools reach them. Reference only: the competition repo must be
# created empty and filled after 10:45 on Day 1.
#
#   docker compose -f nascon_setup/docker-compose.smoke.yml up -d --wait
#   python -m pytest nascon_setup/test_smoke.py --html=nascon_setup/report.html --self-contained-html
#   docker run --rm --network nascon_smoke_default -v "%cd%/nascon_setup:/scripts" grafana/k6:0.54.0 run /scripts/k6_smoke.js
#   docker compose -f nascon_setup/docker-compose.smoke.yml down

name: nascon_smoke

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: smoke-only   # local throwaway container, not a real secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30

  cache:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  selenium-hub:
    image: selenium/hub:4.24.0
    ports:
      - "4444:4444"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 2s
      retries: 60

  chrome:
    image: selenium/node-chrome:4.24.0
    shm_size: "1gb"            # booklet §3: shared memory for the browser
    depends_on:
      selenium-hub:
        condition: service_healthy
    environment:
      SE_EVENT_BUS_HOST: selenium-hub
      SE_EVENT_BUS_PUBLISH_PORT: "4442"
      SE_EVENT_BUS_SUBSCRIBE_PORT: "4443"
      SE_START_VNC: "false"    # booklet §3: no remote desktop, less RAM
