name: competition_toolkit_showcase
description: >-
  A gallery app that shows the competition_toolkit components running with
  fakes and in-memory data — no backend, keys or permissions needed.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  competition_toolkit:
    path: ../
  flutter_riverpod: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  shared_preferences: ^2.5.3
  shared_preferences_platform_interface: ^2.4.1

flutter:
  uses-material-design: true
