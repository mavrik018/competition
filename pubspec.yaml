name: competition_toolkit
description: >-
  Reusable Flutter components, screen patterns, services and utilities
  extracted from StudyBuddies, Cookly, Couple and TaskFlow.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

# Each dependency is listed with the toolkit folders that need it. Copying a
# single component into another app only needs the packages its own folder
# lists in that folder's README.
dependencies:
  flutter:
    sdk: flutter

  # 01 theme mode, 03 AsyncValueView, 07 navigation, 08 state, 10 backend
  flutter_riverpod: ^3.3.1
  # Font for the CupertinoIcons used in 02, 04 and 05 — without it they render as empty boxes.
  cupertino_icons: ^1.0.8
  # 01 theme mode persistence, 09 PrefsStore + PrefsRepository
  shared_preferences: ^2.5.3
  # 09 Repository, OfflineQueue, JsonCache
  sqflite: ^2.4.2
  # 10 backend
  supabase_flutter: ^2.17.0
  connectivity_plus: ^7.0.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.6
  purchases_flutter: ^10.10.0
  # 12 reminders, permissions
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0
  flutter_timezone: ^5.1.0
  permission_handler: ^12.0.1
  # 10 ApiClient
  http: ^1.6.0
  # 12 media picking (images / files)
  image_picker: ^1.2.4
  # 10.x keeps the classic FilePicker.platform API; 13.x conflicts with share_plus on win32.
  file_picker: ^10.2.0
  # 12 QR scanning / rendering
  mobile_scanner: ^7.4.2
  pretty_qr_code: ^3.6.0
  # 12 OCR (on-device ML Kit, Android/iOS only)
  google_mlkit_text_recognition: ^0.17.1
  # 12 location
  geolocator: ^14.0.1
  # 12 sharing (12.x for file_picker compatibility)
  share_plus: ^12.0.0
  # 13 voice input
  speech_to_text: ^7.5.0
  # 12 data export (PDF)
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # In-memory SQLite for the persistence tests.
  sqflite_common_ffi: ^2.4.2
  # In-memory SharedPreferencesAsync for the PrefsRepository tests.
  shared_preferences_platform_interface: ^2.4.1
  # Controllable clock for timer tests.
  fake_async: ^1.3.1

flutter:
  uses-material-design: true
